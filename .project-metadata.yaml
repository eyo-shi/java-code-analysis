name: Java Code Analysis
description: |
  Analyze Java source code from any git repository and ingest a business-to-database
  graph into Neo4j. Connects to any Neo4j instance reachable via Bolt URI
  (neo4j-launcher, local Neo4j, Neo4j Aura, etc.).

  After deploy, set values in Project Settings > Advanced > Environment Variables.
  At deploy Configuration you may leave fields empty and configure in Project Settings.

author: Cloudera Inc.
specification_version: 1.0
prototype_version: 4.0
date: "2026-03-07"

# Required for Project Settings keys to exist. AMP also shows these on Deploy Configuration
# (same store per CML AMP spec). Leave Configuration empty at deploy; edit Project Settings.
environment_variables:
  GIT_REPO_URL:
    default: "https://github.com/terasolunaorg/terasoluna-tourreservation-mybatis3"
    description: "Git repository URL to clone. Required unless SOURCE_PATH is set."
  GIT_REF:
    default: "release/5.7.1.SP1.RELEASE"
    description: "Git branch or tag to clone."
  NEO4J_URI:
    default: ""
    description: |
      Internal Bolt URI from neo4j-launcher Application Log, e.g.
      bolt://cml-neo4j-<hash>.mlx-user-<id>:7687
  NEO4J_USERNAME:
    default: "neo4j"
    description: "Neo4j username."
  NEO4J_PASSWORD:
    default: ""
    description: "Neo4j password from neo4j-launcher startup (not a placeholder)."
  CLONE_DIR:
    default: "/tmp/source"
    description: "Directory to clone the source repository into."
  SOURCE_PATH:
    default: ""
    description: "When set, skip git clone and analyze this local path instead."
  PROJECT_ID:
    default: ""
    description: "Neo4j project id. Defaults to the repository name when empty."
  PROJECT_NAME:
    default: ""
    description: "Display name on the Project node. Defaults from repository name when empty."
  EXCLUDE_DIRS:
    default: ".git,target,node_modules,venv,.venv,dist,build,__pycache__,.m2"
    description: "Comma-separated directory names to exclude from analysis."

runtimes:
  - editor: PBJ Workbench
    kernel: Python 3.10
    edition: Standard

tasks:
  - type: create_job
    name: Install Dependencies
    entity_label: install_deps
    script: 0_session-install-dependencies/install-dependencies.py
    kernel: python3
    cpu: 2
    memory: 4
    short_summary: Create job to install project dependencies.
    environment:
      TASK_TYPE: CREATE/RUN_JOB

  - type: run_job
    entity_label: install_deps
    short_summary: Install project dependencies.
    long_summary: >-
      Install Python dependencies required for analysis and Neo4j ingestion.

  - type: create_job
    name: Analyze and Ingest
    entity_label: analyze_and_ingest
    script: 1_session-analyze-ingest/analyze_ingest.py
    kernel: python3
    cpu: 2
    memory: 4
    short_summary: Clone source, analyze Java code, and ingest graph into Neo4j.
    long_summary: >-
      Run manually after setting environment variables in
      Project Settings > Advanced > Environment Variables.
    environment:
      TASK_TYPE: CREATE/RUN_JOB
