name: Java Code Analysis
description: |
  Analyze Java source code from any git repository and ingest a business-to-database
  graph into Neo4j. Connects to any Neo4j instance reachable via Bolt URI
  (neo4j-launcher, local Neo4j, Neo4j Aura, etc.).

  After deploy, set environment variables in Project Settings > Advanced >
  Environment Variables, then run the "Analyze and Ingest" job manually.

author: Cloudera Inc.
specification_version: 1.0
prototype_version: 3.5
date: "2026-03-07"

environment_variables:
  GIT_REPO_URL:
    default: "https://github.com/terasolunaorg/terasoluna-tourreservation-mybatis3"
    description: |
      Git repository URL to clone and analyze.
      Required unless SOURCE_PATH is set.
      Set in Project Settings > Advanced > Environment Variables after deploy.
  GIT_REF:
    default: "release/5.7.1.SP1.RELEASE"
    description: "Git branch or tag to clone (e.g. release/5.7.1.SP1.RELEASE, master)"
  NEO4J_URI:
    default: "bolt://neo4j-launcher:7687"
    description: |
      Bolt URI of the target Neo4j instance (required).
      Set in Project Settings > Advanced > Environment Variables after deploy.
      For CML neo4j-launcher external URLs (*.cloudera.site), use:
        bolt+ssc://neo4j-launcher-xxxxx....cloudera.site:7687
      Use the password shown when neo4j-launcher was started (not the default below).
  NEO4J_USERNAME:
    default: "neo4j"
    description: "Neo4j username (usually neo4j)"
  NEO4J_PASSWORD:
    default: "Neo4jPass1234"
    description: |
      Neo4j password. For neo4j-launcher, copy the password from the launcher
      startup screen (not this default).
  CLONE_DIR:
    default: "/tmp/source"
    description: "Directory to clone the source repository into"
  SOURCE_PATH:
    default: ""
    description: "When set, skip git clone and analyze this local path instead"
  PROJECT_ID:
    default: ""
    description: "Neo4j project identifier for re-ingestion. Defaults to the repository name."
  PROJECT_NAME:
    default: ""
    description: "Display name stored on the Project node. Defaults to a title derived from the repository name."
  EXCLUDE_DIRS:
    default: ".git,target,node_modules,venv,.venv,dist,build,__pycache__,.m2"
    description: "Comma-separated directory names to exclude from analysis"

runtimes:
  - editor: PBJ Workbench
    kernel: Python 3.10
    edition: Standard

tasks:
  - type: create_job
    name: Install Dependencies
    entity_label: install_deps
    script: 0_session-install-dependencies/install-dependencies.py
    kernel: python3
    cpu: 2
    memory: 4
    short_summary: Create job to install project dependencies.
    environment:
      TASK_TYPE: CREATE/RUN_JOB

  - type: run_job
    entity_label: install_deps
    short_summary: Install project dependencies.
    long_summary: >-
      Install Python dependencies required for analysis and Neo4j ingestion.

  - type: create_job
    name: Analyze and Ingest
    entity_label: analyze_and_ingest
    script: 1_session-analyze-ingest/analyze_ingest.py
    kernel: python3
    cpu: 2
    memory: 4
    short_summary: Clone source, analyze Java code, and ingest graph into Neo4j.
    long_summary: >-
      Run manually after setting environment variables in
      Project Settings > Advanced > Environment Variables.
    environment:
      TASK_TYPE: CREATE/RUN_JOB
