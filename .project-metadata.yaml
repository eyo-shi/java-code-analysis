name: Java Code Analysis
description: |
  Analyze Java source code from any git repository and ingest a business-to-database
  graph into Neo4j. Connects to any Neo4j instance reachable via Bolt URI
  (neo4j-launcher, local Neo4j, Neo4j Aura, etc.).

  After deploy, set environment variables in Project Settings > Advanced >
  Environment Variables, then run the "Analyze and Ingest" job manually.

author: Cloudera Inc.
specification_version: 1.0
prototype_version: 3.9
date: "2026-03-07"

runtimes:
  - editor: PBJ Workbench
    kernel: Python 3.10
    edition: Standard

tasks:
  - type: create_job
    name: Install Dependencies
    entity_label: install_deps
    script: 0_session-install-dependencies/install-dependencies.py
    kernel: python3
    cpu: 2
    memory: 4
    short_summary: Create job to install project dependencies.
    environment:
      TASK_TYPE: CREATE/RUN_JOB

  - type: run_job
    entity_label: install_deps
    short_summary: Install project dependencies.
    long_summary: >-
      Install Python dependencies required for analysis and Neo4j ingestion.

  - type: create_job
    name: Analyze and Ingest
    entity_label: analyze_and_ingest
    script: 1_session-analyze-ingest/analyze_ingest.py
    kernel: python3
    cpu: 2
    memory: 4
    short_summary: Clone source, analyze Java code, and ingest graph into Neo4j.
    long_summary: >-
      Run manually after setting environment variables in
      Project Settings > Advanced > Environment Variables.
    environment:
      TASK_TYPE: CREATE/RUN_JOB
